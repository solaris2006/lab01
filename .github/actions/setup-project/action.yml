# Composite action: bundles repeated setup steps so workflows can reuse them
# with a single `uses: ./.github/actions/setup-project` line.
name: Setup project
description: Install Python and the dev dependencies
inputs:
  python-version:
    description: Python version to install
    default: "3.12"
outputs:
  python-path:
    description: Path to the installed Python interpreter
    value: ${{ steps.py.outputs.python-path }}
runs:
  using: composite
  steps:
    - id: py
      uses: actions/setup-python@v5
      with:
        python-version: ${{ inputs.python-version }}
    - name: Install dev dependencies
      shell: bash
      run: |
        python -m pip install --upgrade pip
        pip install -r requirements-dev.txt
