# Reusable workflow: called from other workflows with `uses:`.
name: Reusable greet

on:
  workflow_call:
    inputs:
      who:
        type: string
        required: true
    secrets:
      token:
        required: false
    outputs:
      message:
        description: The greeting produced
        value: ${{ jobs.greet.outputs.message }}

jobs:
  greet:
    runs-on: ubuntu-latest
    outputs:
      message: ${{ steps.say.outputs.message }}
    steps:
      - uses: actions/checkout@v4
      - id: say
        env:
          WHO: ${{ inputs.who }}   # pass inputs via env, not inline, to avoid script injection
        run: echo "message=$(python3 greetings.py "$WHO" | head -n1)" >> "$GITHUB_OUTPUT"
