# Create a GitHub Release when a version tag is pushed: git tag v1.0.0 && git push --tags
name: Release

on:
  push:
    tags: ["v*.*.*"]

permissions:
  contents: write              # needed to create releases

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Build
        run: |
          mkdir -p dist
          tar czf "dist/lab01-${{ github.ref_name }}.tar.gz" greetings.py hello.py README.md
      - name: Create release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "${{ github.ref_name }}" dist/* \
            --title "${{ github.ref_name }}" \
            --generate-notes
